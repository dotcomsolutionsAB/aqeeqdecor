    <div class="overlay"></div>
    <div class="coming-soon-inner position-absolute top-50 start-50 translate-middle text-center w-lg-50 w-md-75 m-auto grey">
      <div class="logo mb-4">

            <div class="counter-box p-3 h4">

            </div>
          </div>
          <div class="col-lg-12 col-6">
            <div class="counter-box p-3 h4">
              <span class="h1 white fw-bold" id="seconds">00</span> <span>Seconds</span>
