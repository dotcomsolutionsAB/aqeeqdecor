        :root {
            --olive: #4a5430;
            --olive-dark: #31381f;
            --cream: #f6f3ee;
            --soft-cream: #fbfaf7;
            --card: #ffffff;
            --text: #2b2b2b;
            --muted: #756f66;
            --line: #e7e1d8;
            --shadow: 0 10px 30px rgba(29, 24, 18, 0.08);
            --radius: 18px;
            --container: 1240px;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: var(--soft-cream);
        }
        img {
            width: 100%;
            display: block;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button, input { font: inherit; }
        .container {
            width: min(var(--container), calc(100% - 48px));
            margin: 0 auto;
        }

        .top-bar {
            background: linear-gradient(90deg, #556337, #434e2b 55%, #59673d);
            color: #fff;
            font-size: 12px;
        }
        .top-bar .container {
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .top-bar span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0.95;
            white-space: nowrap;
        }
        .top-bar span::before {
            content: '✦';
            font-size: 10px;
            opacity: 0.8;
        }

        header {
            background: rgba(255,255,255,0.98);
            border-bottom: 1px solid #ece7df;
            position: sticky;
            top: 0;
            z-index: 1200;
            backdrop-filter: blur(8px);
        }
        .navbar {
            min-height: 84px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            position: relative;
            z-index: 1201;
        }
        .menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            border: 1px solid #e9e2d8;
            border-radius: 10px;
            background: #fff;
            color: var(--olive);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex-direction: column;
            gap: 5px;
        }
        .menu-toggle span {
            display: block;
            width: 18px;
            height: 2px;
            background: currentColor;
            border-radius: 999px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }
        .menu-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .logo-text { line-height: 1; }
        .logo-text strong {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--olive);
        }
        .logo-text span {
            display: block;
            font-size: 10px;
            letter-spacing: 0.34em;
            color: var(--muted);
            margin-top: 2px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex: 1;
            gap: 22px;
            flex-wrap: wrap;
        }
        nav a {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: #47433c;
            transition: color 0.2s ease;
        }
        nav a:hover,
        nav a.active {
            color: var(--olive);
        }

        .nav-item {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .nav-item > a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: auto;
        }
        .nav-item.services-menu > a::after,
        .has-children > a::after {
            content: '▾';
            font-size: 0.85em;
            line-height: 1;
            transition: transform 0.25s ease;
        }
        .nav-item.services-menu:hover > a::after { transform: rotate(180deg); }
        .has-children { position: relative; }
        .has-children:hover > a::after { transform: rotate(-90deg); }

        .dropdown-menu,
        .sub-dropdown {
            list-style: none;
            margin: 0;
            padding: 12px 0;
            background: #fff;
            border: 1px solid #ece4d9;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(29, 24, 18, 0.12);
        }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            min-width: 280px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
            z-index: 60;
            display: block;
        }
        .nav-item.services-menu:hover > .dropdown-menu {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }
        .dropdown-menu > li,
        .sub-dropdown > li { position: relative; }
        .dropdown-menu > li > a,
        .sub-dropdown > li > a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 18px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #5a544a;
            transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
            text-align: left;
            border-radius: 10px;
        }
        .dropdown-menu > li > a:hover,
        .sub-dropdown > li > a:hover {
            background: rgba(74,84,48,0.12);
            color: var(--olive);
            padding-left: 22px;
        }
        .sub-dropdown {
            position: absolute;
            top: 0;
            left: 100%;
            min-width: 240px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 70;
        }
        .has-children::before {
            content: '';
            position: absolute;
            top: 0;
            right: -14px;
            width: 14px;
            height: 100%;
        }
        .has-children:hover > .sub-dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .call-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 8px;
            background: var(--olive);
            color: #fff !important;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            border: 1px solid var(--olive);
            transition: background 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
        }
        .call-btn:hover {
            background: var(--olive-dark);
            border-color: var(--olive-dark);
        }
        .call-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            font-size: 16px;
            line-height: 1;
            transform-origin: 50% 100%;
            animation: ringPhone 1.4s ease-in-out infinite;
        }
        .call-icon::before,
        .call-icon::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 999px;
            opacity: 0;
            transform: scale(0.7);
            animation: ringPulse 1.4s ease-out infinite;
        }
        .call-icon::after { animation-delay: 0.35s; }
        @keyframes ringPhone {
            0%,100% { transform: rotate(0deg); }
            10% { transform: rotate(14deg); }
            20% { transform: rotate(-12deg); }
            30% { transform: rotate(14deg); }
            40% { transform: rotate(-10deg); }
            50% { transform: rotate(8deg); }
            60% { transform: rotate(0deg); }
        }
        @keyframes ringPulse {
            0% { opacity: 0; transform: scale(0.7); }
            30% { opacity: 0.6; }
            100% { opacity: 0; transform: scale(1.35); }
        }

        .page-hero {
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: linear-gradient(rgba(26, 24, 20, 0.42), rgba(26, 24, 20, 0.42)), url('https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center center;
            overflow: hidden;
        }
        .page-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.14) 100%);

            position: relative;
            z-index: 1;
            padding: 56px 0 52px;

        .page-hero p {
            margin: 0;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.86);
        }

        .section {
            padding: 58px 0 0;
        }
        .blogs-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.34fr) minmax(320px, 0.66fr);
            gap: 28px;
            align-items: start;
        }
        .section-title {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin: 0 0 16px;
            color: var(--olive);
        }
        .section-title::after {
            content: '';
            display: block;
            width: 54px;
            height: 2px;
            background: #d3cabd;
            margin: 12px auto 0;
            border-radius: 999px;
        }
        .section-copy {
            max-width: 780px;
            margin: 0 auto 34px;
            text-align: center;
            color: #5d564e;
            line-height: 1.8;
            font-size: 14px;
        }

        .featured-blog,
        .blog-card,
        .sidebar-card,
        .blog-cta {
            background: #fff;
            border: 1px solid #eee6db;
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .featured-blog {
            overflow: hidden;
            margin-bottom: 24px;
        }
        .featured-blog-image {
            aspect-ratio: 1.68 / 0.86;
            overflow: hidden;
            background: #e9e2d8;
        }
        .featured-blog-image img {
            height: 100%;
            object-fit: cover;
        }
        .featured-blog-body {
            padding: 28px 28px 30px;
            background: linear-gradient(180deg, rgba(74,84,48,0.07) 0%, rgba(74,84,48,0.02) 100%);
        }
        .eyebrow {
            margin: 0 0 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #56603a;
        }
        .featured-blog-body h2 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.4rem, 3.8vw, 3.6rem);
            line-height: 0.98;
            font-weight: 600;
            color: #191612;
        }
        .featured-blog-body p {
            margin: 16px 0 0;
            color: #5b554d;
            line-height: 1.9;
            font-size: 14px;
        }
        .featured-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 18px;
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .featured-actions {
            margin-top: 24px;
        }
        .btn-dark,
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 15px 24px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-dark {
            background: var(--olive);
            color: #fff;
            border: 1px solid var(--olive);
            box-shadow: 0 12px 24px rgba(73, 86, 42, 0.18);
        }
        .btn-dark:hover {
            background: var(--olive-dark);
            border-color: var(--olive-dark);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d4cbc0;
            color: #312b24;
        }
        .btn-outline:hover { background: #fff; }
